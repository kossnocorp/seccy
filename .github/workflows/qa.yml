name: QA
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfido2-dev libtss2-dev libsecret-1-dev libgcr-4-dev pkg-config
      - uses: ./.github/actions/setup
      - run: mise run check
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked
      - run: lua pkgs/fnox/test.lua
      - if: runner.os == 'Linux'
        run: mise run linux:sign:test
      - if: runner.os == 'Linux'
        run: python3 scripts/test-install.py
      - uses: ./.github/actions/cache-save
      - if: always()
        uses: ./.github/actions/stats
  website:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          enable-node: true
      - run: mise //pkgs/website:types
      - run: mise //pkgs/website:build
      - uses: ./.github/actions/cache-save
        with:
          enable-node: true

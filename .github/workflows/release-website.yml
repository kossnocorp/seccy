name: Release Website
on:
  push:
    tags:
      - 'website@[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
      - 'website@[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]+'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment: release-website
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          enable-node: true
      - run: mise //pkgs/website:types
      - run: mise //pkgs/website:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

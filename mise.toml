# Monorepo #####################################################################

monorepo_root = true
[monorepo]
config_roots = ["pkgs/*"]


# Settings #####################################################################

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"] # Use rust-toolchain.toml
cargo.binstall = true


[tools]

# Stack ########################################################################

node = "24"
pnpm = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-release" = "1.1.6"
watchexec = "latest"
sccache = "latest"
gh = "latest"
jaq = "latest"
fnox = "1.47.0"
age = "latest"
git-cliff = "latest"
lua = "5.4"


# Tasks ########################################################################

[tasks.format]
run = "cargo fmt --all"

[tasks."format:check"]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
depends = ["//:format:check", "//:lint", "//:package:check"]

[tasks.test]
run = "cargo test --workspace"

[tasks.build]
run = "cargo build --workspace"

[tasks.release]
run = "cargo build --release --workspace"

[tasks.run]
run = "cargo run -p seccy_cli --"

[tasks.package]
description = "Package and sign the CLI (loads missing signing identity and provisioning profile from fnox)"
depends = ["release"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
secrets=()
[[ -n ${SECCY_SIGNING_IDENTITY:-} ]] || secrets+=(--only SECCY_SIGNING_IDENTITY)
[[ -n ${SECCY_PROFILE:-} || -n ${SECCY_PROFILE_BASE64:-} ]] || secrets+=(--only SECCY_PROFILE_BASE64)
if [[ -z ${secrets[*]:-} ]]; then
  exec bash pkgs/macos/scripts/package.sh
fi
exec fnox exec "${secrets[@]}" --if-missing error -- bash pkgs/macos/scripts/package.sh
'''

[tasks."package:check"]
description = "Check the Bash packaging and notarization scripts"
run = [
  "bash -n scripts/install.sh",
  "bash -n pkgs/cli/src/shell-session.sh",
  "bash -n scripts/build.sh",
  "bash -n scripts/macos-ci.sh",
  "bash -n pkgs/macos/scripts/package.sh",
  "bash -n pkgs/macos/scripts/build-icon.sh",
  "bash -n pkgs/macos/scripts/notarize.sh",
  "bash -n pkgs/macos/scripts/notarize-setup.sh",
  "bash -n pkgs/linux/scripts/release.sh",
  "bash -n pkgs/linux/scripts/setup-link.sh",
]

[tasks."linux:package"]
description = "Build and package the Linux CLI and fnox provider"
run = "bash pkgs/linux/scripts/release.sh package"

[tasks."setup:link"]
description = "Build and link a local Linux installation into ~/.local/bin (XDG-aware)"
run = "bash pkgs/linux/scripts/setup-link.sh"

[tasks."linux:sign"]
description = "Sign the Linux archive using SECCY_RELEASE_KEY"
raw = true
run = "bash pkgs/linux/scripts/release.sh sign"

[tasks."linux:verify"]
description = "Verify the Linux archive using SECCY_ALLOWED_SIGNERS"
run = "bash pkgs/linux/scripts/release.sh verify"

[tasks."linux:sign:test"]
description = "Check release verification rejects tampering and untrusted keys"
run = "bash pkgs/linux/scripts/test-release.sh"

[tasks."linux:tpm:test"]
description = "Verify the native TPM backend against an isolated swtpm instance"
run = "bash pkgs/linux/scripts/test-tpm.sh"

[tasks."notarize:setup"]
description = "Store Apple notarization credentials in Keychain (loads missing credentials from fnox)"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
secrets=()
for key in SECCY_APPLE_ID SECCY_TEAM_ID SECCY_NOTARY_PROFILE SECCY_APPLE_PASSWORD; do
  [[ -n ${!key:-} ]] || secrets+=(--only "$key")
done
if [[ -z ${secrets[*]:-} ]]; then
  exec bash pkgs/macos/scripts/notarize-setup.sh
fi
exec fnox exec "${secrets[@]}" --if-missing error -- bash pkgs/macos/scripts/notarize-setup.sh
'''

[tasks.notarize]
description = "Build, sign, notarize and create target/Seccy-notarized.zip"
depends = ["package"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n ${SECCY_NOTARY_PROFILE:-} ]]; then
  exec bash pkgs/macos/scripts/notarize.sh
fi
exec fnox exec --only SECCY_NOTARY_PROFILE --if-missing error -- bash pkgs/macos/scripts/notarize.sh
'''

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks."build:archive"]
description = "Build a distributable archive; macOS signs and notarizes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $(uname -s) != Darwin ]]; then
  exec bash scripts/build.sh "$@"
fi
secrets=()
for key in SECCY_SIGNING_IDENTITY SECCY_NOTARY_PROFILE; do
  [[ -n ${!key:-} ]] || secrets+=(--only "$key")
done
[[ -n ${SECCY_PROFILE:-} || -n ${SECCY_PROFILE_BASE64:-} ]] || secrets+=(--only SECCY_PROFILE_BASE64)
if [[ -z ${secrets[*]:-} ]]; then
  exec bash scripts/build.sh "$@"
fi
exec fnox exec "${secrets[@]}" --if-missing error -- bash scripts/build.sh "$@"
'''

[tasks."setup:archive"]
description = "Install a release archive and configure seccy (pass --archive PATH)"
run = "bash scripts/install.sh"

[tasks."macos/install-source"]
description = "Build, sign, notarize, and replace the installed app without service/fnox integration"
depends = ["notarize"]
run = "bash scripts/install.sh --archive target/Seccy-notarized.zip --force --no-integrate"

[tasks.changelog]
run = "git-cliff --config cliff.toml --offline --latest --strip all"
quiet = true

[tasks."version:cli"]
description = "Bump the shared CLI crate version, commit, and tag locally"
usage = '''
arg "<version>" help="Release version (X.Y.Z)" validate="value matches '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'" validate_error="Expected a version in X.Y.Z format (no leading zeros)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
  echo 'Working tree is dirty; commit or stash changes before versioning.' >&2
  exit 1
fi
tag="cli@$usage_version"
if git show-ref --verify --quiet "refs/tags/$tag"; then
  echo "Tag $tag already exists." >&2
  exit 1
fi
cargo release version "$usage_version" --workspace --no-confirm --execute
git add Cargo.toml Cargo.lock pkgs/*/Cargo.toml
git commit -m "Bump $tag"
git tag "$tag"
'''

[tasks."release:cli"]
description = "Version the CLI, then push commits and tags"
usage = '''
arg "<version>" help="Release version (X.Y.Z)" validate="value matches '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'" validate_error="Expected a version in X.Y.Z format (no leading zeros)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run //:version:cli "$usage_version"
git push
git push --tags
'''

[tasks."release/cli:rollback"]
description = "Remove a CLI release, its tags, and its version-bump commit from local history"
usage = '''
arg "<version>" help="Release version (X.Y.Z)" validate="value matches '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'" validate_error="Expected a version in X.Y.Z format (no leading zeros)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="cli@$usage_version"
# Search history even when an earlier rollback already removed the tag.
bumps=$(git log --first-parent --format='%H %s' | awk -v subject="Bump $tag" '
  substr($0, index($0, " ") + 1) == subject { print $1 }
')
if [[ $(printf '%s\n' "$bumps" | awk 'NF { n++ } END { print n+0 }') -gt 1 ]]; then
  echo "Multiple commits named Bump $tag; refusing an ambiguous rollback." >&2
  exit 1
fi
if [[ -n "$bumps" ]]; then
  git symbolic-ref --quiet HEAD >/dev/null
  parents=$(git rev-list --parents -n 1 "$bumps")
  if [[ $(printf '%s\n' "$parents" | awk '{print NF}') != 2 ]]; then
    echo "Version-bump commit must have exactly one parent." >&2
    exit 1
  fi
  for state in rebase-merge rebase-apply MERGE_HEAD CHERRY_PICK_HEAD REVERT_HEAD; do
    if [[ -e $(git rev-parse --git-path "$state") ]]; then
      echo "Finish the current Git operation before rolling back." >&2
      exit 1
    fi
  done
fi
if git show-ref --verify --quiet "refs/tags/$tag"; then
  git tag --delete "$tag"
fi
remote_tag=$(git ls-remote --tags origin "refs/tags/$tag")
if [[ -n "$remote_tag" ]]; then
  git push origin --delete "refs/tags/$tag"
fi
if release=$(gh api "repos/kossnocorp/seccy/releases/tags/$tag" 2>&1); then
  gh release delete "$tag" --repo kossnocorp/seccy --yes
elif [[ "$release" != *"(HTTP 404)"* ]]; then
  printf '%s\n' "$release" >&2
  exit 1
fi
if [[ -n "$bumps" ]]; then
  # Replay later commits while dropping only the release task's bump commit.
  # Git restores tracked local edits through autostash and stops on conflicts.
  git rebase --rebase-merges --autostash --empty=keep --onto "$bumps^" "$bumps"
fi
'''

[tasks."release:version"]
description = "Tag the next website version for today (YYYY-MM-DD.N) locally"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
  echo 'Working tree is dirty; commit or stash changes before versioning.' >&2
  exit 1
fi
day=$(date +%Y-%m-%d)
revision=$(git tag --list "website@$day.*" | awk -F. '
  $0 ~ /^website@[0-9]{4}-[0-9]{2}-[0-9]{2}[.][0-9]+$/ && $NF + 0 > max { max = $NF + 0 }
  END { printf "%.0f", max + 1 }
')
tag="website@$day.$revision"
git tag "$tag"
echo "$tag"
'''

[tasks."release:website"]
description = "Version the website, then push commits and tags"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run //:release:version
git push
git push --tags
'''

[tasks."macos/ui:build"]
description = "Build the SwiftUI gallery (no signing credentials required)"
run = "xcodebuild -quiet -project pkgs/macos-ui/SeccyUI.xcodeproj -scheme Gallery -configuration Debug -destination 'platform=macOS' -derivedDataPath target/xcode CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build"

[tasks."macos/ui"]
description = "Run the SwiftUI gallery in the foreground with event logs on stdout"
depends = ["//:macos/ui:build"]
raw = true
run = "exec 'target/xcode/Build/Products/Debug/Seccy UI Gallery.app/Contents/MacOS/Seccy UI Gallery'"

[tasks."macos/ui:check"]
description = "Build the gallery and test UI request/lifecycle invariants"
depends = ["//:macos/ui:build"]
run = "swift test --package-path pkgs/macos-ui --scratch-path target/swift-tests"

[tasks."macos/ui:watch"]
description = "Rebuild and restart the gallery when Swift, Fluent, shared Rust, or assets change"
raw = true
run = '''
exec watchexec --restart --debounce 500ms --stop-timeout 5s --shell=none \
  --watch pkgs/macos-ui --watch pkgs/ui --watch pkgs/core --watch pkgs/macos \
  --watch vendor --watch assets --watch .cargo --watch-non-recursive . \
  --filter '**/*.{swift,rs,ftl,toml,lock,pbxproj,xcscheme,plist,xcconfig,svg,png,icns,sh,py}' \
  --ignore '**/Copy.generated.swift' --ignore '**/xcuserdata/**' \
  --ignore '**/.build/**' --ignore '/target/**' \
  -- mise run //:macos/ui
'''

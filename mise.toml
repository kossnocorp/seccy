# Monorepo #####################################################################

monorepo_root = true
[monorepo]
config_roots = ["pkgs/*"]


# Settings #####################################################################

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"] # Use rust-toolchain.toml
cargo.binstall = true


[tools]

# Stack ########################################################################

node = "24"
pnpm = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-release" = "1.1.6"
sccache = "latest"
gh = "latest"
jaq = "latest"
fnox = "1.47.0"
age = "latest"
git-cliff = "latest"
lua = "5.4"


# Tasks ########################################################################

[tasks.format]
run = "cargo fmt --all"

[tasks."format:check"]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
depends = ["//:format:check", "//:lint", "//:package:check"]

[tasks.test]
run = "cargo test --workspace"

[tasks.build]
run = "cargo build --workspace"

[tasks.release]
run = "cargo build --release --workspace"

[tasks.run]
run = "cargo run -p seccy_cli --"

[tasks.package]
description = "Package and sign the CLI for macOS keychain access (requires SECCY_SIGNING_IDENTITY and SECCY_PROFILE)"
depends = ["release"]
run = "bash pkgs/macos/scripts/package.sh"

[tasks."package:check"]
description = "Check the Bash packaging and notarization scripts"
run = [
  "bash -n scripts/install.sh",
  "bash -n scripts/build.sh",
  "bash -n scripts/macos-ci.sh",
  "bash -n pkgs/macos/scripts/package.sh",
  "bash -n pkgs/macos/scripts/notarize.sh",
  "bash -n pkgs/macos/scripts/notarize-setup.sh",
  "bash -n pkgs/linux/scripts/release.sh",
  "bash -n pkgs/linux/scripts/setup-link.sh",
]

[tasks."linux:package"]
description = "Build and package the Linux CLI and fnox provider"
run = "bash pkgs/linux/scripts/release.sh package"

[tasks."setup:link"]
description = "Build and link a local Linux installation into ~/.local/bin (XDG-aware)"
run = "bash pkgs/linux/scripts/setup-link.sh"

[tasks."linux:sign"]
description = "Sign the Linux archive using SECCY_RELEASE_KEY"
raw = true
run = "bash pkgs/linux/scripts/release.sh sign"

[tasks."linux:verify"]
description = "Verify the Linux archive using SECCY_ALLOWED_SIGNERS"
run = "bash pkgs/linux/scripts/release.sh verify"

[tasks."linux:sign:test"]
description = "Check release verification rejects tampering and untrusted keys"
run = "bash pkgs/linux/scripts/test-release.sh"

[tasks."linux:tpm:test"]
description = "Verify the native TPM backend against an isolated swtpm instance"
run = "bash pkgs/linux/scripts/test-tpm.sh"

[tasks."notarize:setup"]
description = "Store Apple notarization credentials in Keychain (SECCY_APPLE_PASSWORD or interactive prompt)"
raw = true
run = "bash pkgs/macos/scripts/notarize-setup.sh"

[tasks.notarize]
description = "Build, sign, notarize and create target/Seccy-notarized.zip"
depends = ["package"]
run = "bash pkgs/macos/scripts/notarize.sh"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks."build:archive"]
description = "Build a distributable archive; macOS signs and notarizes"
run = "bash scripts/build.sh"

[tasks."setup:archive"]
description = "Install a release archive and configure seccy (pass --archive PATH)"
run = "bash scripts/install.sh"

[tasks.changelog]
run = "git-cliff --config cliff.toml --offline --latest --strip all"
quiet = true

[tasks."version:cli"]
description = "Bump the shared CLI crate version, commit, and tag locally"
usage = '''
arg "<version>" help="Release version (X.Y.Z)" validate="value matches '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'" validate_error="Expected a version in X.Y.Z format (no leading zeros)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
  echo 'Working tree is dirty; commit or stash changes before versioning.' >&2
  exit 1
fi
tag="cli@$usage_version"
if git show-ref --verify --quiet "refs/tags/$tag"; then
  echo "Tag $tag already exists." >&2
  exit 1
fi
cargo release version "$usage_version" --workspace --no-confirm --execute
git add Cargo.toml Cargo.lock pkgs/*/Cargo.toml
git commit -m "Bump $tag"
git tag "$tag"
'''

[tasks."release:cli"]
description = "Version the CLI, then push commits and tags"
usage = '''
arg "<version>" help="Release version (X.Y.Z)" validate="value matches '^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'" validate_error="Expected a version in X.Y.Z format (no leading zeros)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run //:version:cli "$usage_version"
git push
git push --tags
'''

[tasks."release:version"]
description = "Tag the next website version for today (YYYY-MM-DD.N) locally"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
  echo 'Working tree is dirty; commit or stash changes before versioning.' >&2
  exit 1
fi
day=$(date +%Y-%m-%d)
revision=$(git tag --list "website@$day.*" | awk -F. '
  $0 ~ /^website@[0-9]{4}-[0-9]{2}-[0-9]{2}[.][0-9]+$/ && $NF + 0 > max { max = $NF + 0 }
  END { printf "%.0f", max + 1 }
')
tag="website@$day.$revision"
git tag "$tag"
echo "$tag"
'''

[tasks."release:website"]
description = "Version the website, then push commits and tags"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run //:release:version
git push
git push --tags
'''

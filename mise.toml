# Monorepo #####################################################################

monorepo_root = true
[monorepo]
config_roots = ["pkgs/*"]

[tools]

# Stack ########################################################################

node = "latest"

# Tasks ########################################################################

[tasks.format]
run = "cargo fmt --all"

[tasks."format:check"]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
depends = ["//:format:check", "//:lint", "//:package:check"]

[tasks.test]
run = "cargo test --workspace"

[tasks.build]
run = "cargo build --workspace"

[tasks.release]
run = "cargo build --release --workspace"

[tasks.run]
run = "cargo run -p seccy_cli --"

[tasks.package]
description = "Package and sign the CLI for macOS keychain access (requires SECCY_SIGNING_IDENTITY and SECCY_PROFILE)"
depends = ["release"]
run = "bash pkgs/macos/scripts/package.sh"

[tasks."package:check"]
description = "Check the Bash packaging script syntax"
run = "bash -n pkgs/macos/scripts/package.sh"


# Settings #####################################################################

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"] # Use rust-toolchain.toml

[package]
name = "seccy_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "seccy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
seccy_core.workspace = true
seccy_macos.workspace = true
usage-rs = "7"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

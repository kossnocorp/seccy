[package]
name = "seccy_macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
seccy_core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
libc = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }

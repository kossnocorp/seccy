[workspace]
members = ["pkgs/*"]
exclude = ["pkgs/fnox", "pkgs/website"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
seccy_core = { path = "pkgs/core" }
seccy_macos = { path = "pkgs/macos" }
seccy_linux = { path = "pkgs/linux" }

# Xcode 27/dyld rejects stripped build-time proc macros with a misaligned
# LINKEDIT string pool at the macOS 12 deployment target. These are not shipped.
[profile.release.build-override]
strip = "none"

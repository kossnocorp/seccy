# Copy to ~/.config/seccy/config.toml (or $XDG_CONFIG_HOME/seccy/config.toml).
# See docs/providers.md for selectors, named providers and local overrides.
log_level = "info"
email = "koss@nocorp.me"
mode = "prompt"
# macOS defaults to secure-enclave. Linux requires an explicit provider:
# provider = "tpm-fido2-hmac"

[keys.auth]
use = "ssh-auth"
forge = "github"

[keys.signing]
use = "ssh-sign"
mode = "notify" # Secure Enclave only.
forge = "github"
email = "work@example.com"

[keys.secrets]
use = "secrets"
name = "Machine secrets"
